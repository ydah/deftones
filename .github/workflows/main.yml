name: Ruby
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.1'
            experimental: false
          - ruby: '3.2'
            experimental: false
          - ruby: '3.3'
            experimental: false
          - ruby: '3.4'
            experimental: false
          - ruby: '4.0'
            experimental: true
          - ruby: 'head'
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Smoke require with warnings
        run: bundle exec ruby -w -Ilib -e 'require "deftones"; puts Deftones.version'
      - name: Run the default task
        run: bundle exec rake
      - name: Run package quality checks
        run: bundle exec rake quality
      - name: Build the gem
        run: bundle exec rake build
